    <style>
    .blog-hero{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:60px 20px;text-align:center;color:#fff;margin-bottom:40px}
    .blog-hero h1{font-size:2.2rem;font-weight:800;margin-bottom:10px}
    .blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;max-width:1200px;margin:0 auto;padding:0 20px 60px}
    .post-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);transition:.25s;display:flex;flex-direction:column;text-decoration:none;color:inherit;border:1px solid #eee}
    .post-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(99,102,241,.15)}
    .post-cover{height:170px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff}
    .post-cover img{width:100%;height:100%;object-fit:cover}
    .post-body{padding:18px;flex:1;display:flex;flex-direction:column;gap:8px}
    .post-body h3{font-size:1.05rem;font-weight:700;line-height:1.6}
    .post-excerpt{font-size:.85rem;color:#666;line-height:1.7;flex:1}
    .post-meta{display:flex;justify-content:space-between;font-size:.75rem;color:#999;border-top:1px solid #f0f0f0;padding-top:10px}
    .empty{max-width:500px;margin:80px auto;text-align:center;color:#999;padding:0 20px}
    @media(max-width:600px){.blog-hero h1{font-size:1.5rem}.blog-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>

        <div class="nav-buttons" id="authButtons"></div>

    <section class="blog-hero"><h1>📝 مدونة منصة مسار</h1><p>مقالات ونصائح لتطوير مهاراتك</p></section>
    <div class="blog-grid" id="postsGrid"><p style="text-align:center;color:#999;grid-column:1/-1">جاري التحميل...</p></div>

    <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/app.js?v=20261008"></script>
    <script>
    (async function(){
        try{
            const res = await fetch(CONFIG.API_BASE_URL + '/blog?limit=50');
            const data = await res.json();
            const grid = document.getElementById('postsGrid');
            if(!data.results || !data.results.length){
                grid.innerHTML = '<div class="empty">📭 لا توجد مقالات بعد — قريباً مقالات جديدة!</div>';
                return;
            }
            const covers=['https://pub-f2c0b43b09ea4983a05bdb7998fafdf3.r2.dev/covers/programming.png','https://pub-f2c0b43b09ea4983a05bdb7998fafdf3.r2.dev/covers/design.png','https://pub-f2c0b43b09ea4983a05bdb7998fafdf3.r2.dev/covers/languages.png'];
            grid.innerHTML = data.results.map((p,i)=>{
                const cover = p.cover_url || covers[i%covers.length];
                const d = p.created_at ? new Date(p.created_at).toLocaleDateString('ar',{year:'numeric',month:'long',day:'numeric'}) : '';
                return `<a href="post.html?slug=${encodeURIComponent(p.slug)}" class="post-card">
                    <div class="post-cover">${cover?`<img src="${cover}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>
                    <div class="post-body">
                        <h3>${p.title}</h3>
                        <p class="post-excerpt">${(p.excerpt||'').substring(0,140)}</p>
                        <div class="post-meta"><span>✍️ ${p.author_name||'مسار'}</span><span>👁 ${p.views} · ${d}</span></div>
                    </div></a>`;
            }).join('');
        }catch(e){
            document.getElementById('postsGrid').innerHTML='<div class="empty">تعذر تحميل المقالات</div>';
        }
    })();
    </script>
