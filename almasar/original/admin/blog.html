<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المدونة | منصة مسار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f5f6fa;color:#1a1a2e}
.wrap{max-width:900px;margin:30px auto;padding:0 20px 80px}
h1{font-size:1.4rem;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.btn{border:none;padding:10px 22px;border-radius:10px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.9rem}
.btn-primary{background:#6366f1;color:#fff}.btn-primary:hover{background:#4f46e5}
.post-row{background:#fff;border:1px solid #e8e8ef;border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.post-row h3{font-size:.95rem}
.post-row .meta{font-size:.75rem;color:#999;margin-top:4px}
.actions{display:flex;gap:8px}
.btn-sm{padding:7px 14px;font-size:.8rem;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-weight:600}
.btn-edit{background:#eef2ff;color:#4f46e5}.btn-del{background:#fef2f2;color:#dc2626}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;max-width:720px;width:100%;padding:28px}
.modal h2{font-size:1.15rem;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;border:1.5px solid #dfe0ea;border-radius:10px;padding:10px 14px;font-family:inherit;font-size:.9rem}
.form-group textarea{min-height:200px;resize:vertical;line-height:1.8}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>📝 إدارة المدونة <button class="btn btn-primary" onclick="openEditor()">+ مقال جديد</button></h1>
<div id="postsList">جاري التحميل...</div>
</div>

<div class="overlay" id="editorOverlay">
<div class="modal">
<h2 id="editorTitle">مقال جديد</h2>
<div class="form-group"><label>العنوان *</label><input id="pTitle" type="text"></div>
<div class="row2">
<div class="form-group"><label>الرابط (slug) — اختياري</label><input id="pSlug" type="text" placeholder="تلقائي من العنوان"></div>
<div class="form-group"><label>الحالة</label><select id="pStatus"><option value="published">منشور</option><option value="draft">مسودة</option></select></div>
</div>
<div class="form-group"><label>المقدمة/الوصف</label><textarea id="pExcerpt" style="min-height:70px"></textarea></div>
<div class="form-group"><label>رابط صورة الغلاف — اختياري</label><input id="pCover" type="url" placeholder="https://..."></div>
<div class="form-group"><label>المحتوى (HTML) *</label><textarea id="pContent" placeholder="<p>نص المقال هنا...</p>"></textarea></div>
<button class="btn btn-primary" onclick="savePost()" id="saveBtn">💾 حفظ</button>
<button class="btn btn-sm btn-del" onclick="closeEditor()">إلغاء</button>
</div>
</div>

<script src="../js/config.js"></script>
<script>
const token = localStorage.getItem('auth_token') || '';
let editingId = null;

async function loadPosts(){
  try{
    const res = await fetch(CONFIG.API_BASE_URL + '/blog?limit=50');
    const data = await res.json();
    const el = document.getElementById('postsList');
    if(!data.results || !data.results.length){el.innerHTML='<p style="color:#999;text-align:center;padding:60px 0">لا توجد مقالات بعد</p>';return}
    el.innerHTML = data.results.map(p=>`
      <div class="post-row">
        <div><h3>${p.title}</h3><div class="meta">${p.slug} · 👁 ${p.views} · ${new Date(p.created_at).toLocaleDateString('ar')}</div></div>
        <div class="actions">
          <button class="btn-sm btn-edit" onclick='editPost(${JSON.stringify(JSON.stringify(p))})'>✏️ تعديل</button>
          <button class="btn-sm btn-del" onclick="delPost('${p.slug}')">🗑️</button>
        </div>
      </div>`).join('');
  }catch(e){document.getElementById('postsList').innerHTML='<p>تعذر التحميل: '+e.message+'</p>'}
}

function openEditor(){editingId=null;document.getElementById('editorTitle').textContent='مقال جديد';
  document.getElementById('pTitle').value='';document.getElementById('pSlug').value='';
  document.getElementById('pExcerpt').value='';document.getElementById('pCover').value='';
  document.getElementById('pContent').value='';document.getElementById('pStatus').value='published';
  document.getElementById('editorOverlay').classList.add('open')}
function closeEditor(){document.getElementById('editorOverlay').classList.remove('open')}

function editPost(jsonStr){
  const p = JSON.parse(jsonStr);
  editingId = p.id;
  document.getElementById('editorTitle').textContent='تعديل المقال';
  document.getElementById('pTitle').value=p.title;
  document.getElementById('pSlug').value=p.slug;
  document.getElementById('pExcerpt').value=p.excerpt||'';
  document.getElementById('pCover').value=p.cover_url||'';
  document.getElementById('pContent').value=p.content_html||'';
  document.getElementById('pStatus').value=p.status||'published';
  document.getElementById('editorOverlay').classList.add('open');
}

async function savePost(){
  const body = {
    title: document.getElementById('pTitle').value.trim(),
    slug: document.getElementById('pSlug').value.trim() || undefined,
    excerpt: document.getElementById('pExcerpt').value.trim(),
    cover_url: document.getElementById('pCover').value.trim(),
    content_html: document.getElementById('pContent').value,
    status: document.getElementById('pStatus').value
  };
  if(!body.title || !body.content_html){alert('العنوان والمحتوى مطلوبان');return}
  const url = editingId ? API_BASE_URL+'/blog/'+editingId : API_BASE_URL+'/blog';
  const res = await fetch(url,{method:editingId?'PUT':'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify(body)});
  if(res.ok){closeEditor();loadPosts()}else{const e=await res.json();alert('خطأ: '+(e.error||res.status))}
}

async function delPost(slug){
  if(!confirm('حذف المقال؟'))return;
  // نجيب id أولاً عبر قائمة (slug unique بس DELETE بياخد id)
  const res = await fetch(API_BASE_URL+'/blog?limit=50');
  const data = await res.json();
  const p = (data.results||[]).find(x=>x.slug===slug);
  if(!p)return;
  const del = await fetch(API_BASE_URL+'/blog/'+p.id,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
  if(del.ok)loadPosts();else alert('تعذر الحذف');
}
loadPosts();
</script>
</body>
</html>
